# Emby Web uses data-appversion as a one-year cache key for every dashboard
# module.  A patched playbackmanager.js can therefore remain invisible to a
# browser even after cookies/cache are cleared partially.  Change this value
# whenever the dashboard patch generation changes so every module URL gets a
# new query key.  The index itself is made revalidating below.
sub_filter_once on;
sub_filter 'data-appversion="4.9.0.42"' 'data-appversion="4.9.0.42-wp3"';
expires -1;
add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
