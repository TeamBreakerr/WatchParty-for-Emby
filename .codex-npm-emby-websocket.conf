# codex-emby-websocket-long-lived
# Nginx Proxy Manager advanced_config for proxy host 15.
# /data/nginx/custom/http_top.conf contains the privacy-safe named log format.
location ~* ^/(embywebsocket|socket)$ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 10s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_socket_keepalive on;
    access_log /data/logs/emby-websocket-diagnostic.log emby_websocket_diagnostic buffer=16k flush=5s;
    include conf.d/include/proxy.conf;
}
