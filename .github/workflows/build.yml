name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test plugin logic
        run: dotnet test test/WatchPartyForEmby.Tests/WatchPartyForEmby.Tests.csproj --configuration Release
      - name: Test control pages
        run: node --test test/configPagePartyModeRegression.test.js
      - name: Build plugin
        run: dotnet build WatchPartyForEmby.csproj --configuration Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: WatchPartyForEmby-1.7.9
          path: bin/Release/net6.0/WatchPartyForEmby.dll
          if-no-files-found: error
