name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Test admin UI
        run: node --test test/configPageSeriesPartyRegression.test.js
      - name: Test
        run: dotnet test test/WatchPartyForEmby.Tests/WatchPartyForEmby.Tests.csproj --configuration Release
      - name: Build plugin
        run: dotnet build WatchPartyForEmby.csproj --configuration Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: WatchPartyForEmby-1.6.1-series-party
          path: bin/Release/net6.0/WatchPartyForEmby.dll
          if-no-files-found: error
