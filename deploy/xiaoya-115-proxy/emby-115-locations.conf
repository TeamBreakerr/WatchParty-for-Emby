set $emby_115_target "";
set $emby_115_target_host "";
set $emby_115_link_uri "";
set $emby_115_link_args "";
set $emby_115_attempt "0";
set $emby_115_key "";

location ^~ /__emby_115_resolve/ {
    internal;
    rewrite ^/__emby_115_resolve/(.*)$ /d/$1 break;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Range "bytes=0-0";
    proxy_set_header If-Range "";
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_redirect off;
    proxy_pass http://127.0.0.1:5244;
}

location @emby_115_stream {
    rewrite ^ /stream break;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:15678;
    proxy_set_header X-Emby-115-Target $emby_115_target;
    proxy_set_header X-Emby-115-Key $emby_115_key;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Icy-MetaData $http_icy_metadata;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_intercept_errors on;
    proxy_redirect off;
    add_header X-Emby-115-Proxy dynamic always;
    error_page 403 = @emby_115_retry;
    proxy_pass http://127.0.0.1:15678;
}

location @emby_115_retry {
    rewrite ^ /stream break;
    access_by_lua_file /data/emby-115-retry.lua;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:15678;
    proxy_set_header X-Emby-115-Target $emby_115_target;
    proxy_set_header X-Emby-115-Key $emby_115_key;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Icy-MetaData $http_icy_metadata;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_redirect off;
    add_header X-Emby-115-Proxy dynamic-retry always;
    proxy_pass http://127.0.0.1:15678;
}
