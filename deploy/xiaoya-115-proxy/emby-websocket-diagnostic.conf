# Temporary, privacy-safe diagnostics for Emby WebSocket tunnels.
#
# Deliberately excluded: client/server addresses, request paths, query strings,
# headers, cookies, user agents and tokens.  The two proxy layers write to
# separate files, while the listening port identifies which layer emitted an
# event without recording a host name or address.
map $server_port $emby_websocket_layer {
    default proxy;
    80 npm_outer;
    443 npm_outer;
    2345 xiaoya_inner;
    6908 xiaoya_inner;
}

# Nginx records upgraded tunnels with status 101 even when its idle timer ends
# them.  Mark a narrow window around the configured 24-hour timeout so those
# closures are not mistaken for a downstream/network failure.
map $request_time $emby_websocket_idle_timeout_window {
    default 0;
    ~^86(39[5-9]|40[0-9])[.] 1;
}

# This is an observed transport boundary, not an invented client identity.
# A downstream close can be either the app/device or the network path; a
# successful 101 tunnel can also end with a normal WebSocket close handshake.
map "$status:$request_completion:$upstream_status:$emby_websocket_idle_timeout_window" $emby_websocket_termination_hint {
    default proxy_or_handshake_failure;
    ~:1$ nginx_idle_timeout;
    ~^101:OK:101:0$ graceful_tunnel_end;
    ~^101::101:0$ downstream_or_network_end;
    ~^499: downstream_or_network_before_upgrade;
    ~^502: emby_upstream_failure;
    ~^503: nginx_proxy_rejection;
    ~^504: nginx_upstream_timeout;
}

log_format emby_websocket_diagnostic escape=json
    '{"time":"$time_iso8601",'
    '"layer":"$emby_websocket_layer",'
    '"connection":"$connection",'
    '"connection_requests":"$connection_requests",'
    '"status":"$status",'
    '"duration_seconds":"$request_time",'
    '"configured_idle_timeout_seconds":"86400",'
    '"request_completed":"$request_completion",'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_seconds":"$upstream_connect_time",'
    '"upstream_header_seconds":"$upstream_header_time",'
    '"upstream_duration_seconds":"$upstream_response_time",'
    '"bytes_to_downstream":"$bytes_sent",'
    '"bytes_from_upstream":"$upstream_bytes_received",'
    '"termination_hint":"$emby_websocket_termination_hint"}';
