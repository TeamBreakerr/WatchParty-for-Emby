# Main-context include for Xiaoya's Nginx.
#
# The dynamic 115 proxy answers a protected Range read as 1 MiB cacheable
# slices.  Each slice needs its own cache and temporary file descriptor, so a
# single multi-gigabyte playback opens descriptors far faster than ordinary
# proxying does.  Xiaoya's image leaves the worker soft RLIMIT_NOFILE at the
# stock 1024 while the container's hard limit is much higher, and an exhausted
# worker logs
#   open() ".../emby-115-slices/..." failed (24: No file descriptors available)
# and truncates the stream mid-playback.
#
# Raise only the soft limit; the value stays well below the container's hard
# limit and does not change Nginx's connection accounting.
worker_rlimit_nofile 65535;
