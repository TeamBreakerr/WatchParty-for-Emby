# Emby Web uses data-appversion as a cache key for dashboard modules.  Bump the
# suffix when the patched playback bundle changes so a browser cannot keep an
# older playbackmanager.js under the same URL.  The index itself is always
# revalidated because it carries this version string.
sub_filter_once on;
sub_filter 'data-appversion="4.9.0.42"' 'data-appversion="4.9.0.42-wp4"';
expires -1;
add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
