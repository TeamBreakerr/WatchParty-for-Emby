# Keep Emby's remote-control WebSockets alive across the inner Xiaoya proxy.
# Emby sends protocol-level WebSocket traffic; this is a transport/proxy timeout
# fix, not an application-level KeepAlive command.
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
proxy_connect_timeout 20s;
proxy_buffering off;
proxy_request_buffering off;
proxy_socket_keepalive on;
access_log /data/logs/emby-websocket-diagnostic.log emby_websocket_diagnostic buffer=16k flush=5s;
