# Serve the foreground-resume fix even when Emby returns its embedded copy of
# connectionmanager.js instead of the patched dashboard file on disk.
location = /web/modules/emby-apiclient/connectionmanager.js {
    proxy_pass $emby;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;

    sub_filter_types application/x-javascript application/javascript text/javascript;
    sub_filter_once on;
    sub_filter 'apiClients[i].ensureWebSocket()' 'apiClients[i].restartWebSocket()';

    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
}
