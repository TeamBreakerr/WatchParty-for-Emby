# Keep Emby remote-control WebSockets alive across the inner Xiaoya proxy.
# This file is included inside location ~ /(socket|embywebsocket).
# The named log format is installed at the Nginx http level from
# emby-websocket-diagnostic.conf.
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
proxy_connect_timeout 10s;
proxy_buffering off;
proxy_request_buffering off;
proxy_socket_keepalive on;
access_log /data/logs/emby-websocket-diagnostic.log emby_websocket_diagnostic buffer=16k flush=5s;
