
map $request_uri $log_d_uri {
    ~^/d/ 1;
    default 0;
}
log_format d_uri_log '$time_iso8601 $remote_addr $request_uri';
access_log /var/log/nginx/d_uri.log d_uri_log if=$log_d_uri;

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apicache:500m inactive=10m;
limit_req_zone $binary_remote_addr zone=two:500m rate=2r/s;
limit_req_zone $binary_remote_addr zone=one:500m rate=1r/s;

map $http_x_forwarded_proto $client_scheme {    
    default $http_x_forwarded_proto;    
    '' $scheme;    
}

server {

        # Emby's dashboard bundles are mutable deployment artifacts.  The
        # generic location below enables the Xiaoya proxy cache, which can
        # otherwise continue serving an old index.html/playbackmanager.js
        # after the Emby container has been updated.  Browser cache/cookies
        # cannot invalidate this server-side cache.  Keep dashboard assets
        # on the live upstream and make the response explicitly revalidate.
        location = /web {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_redirect off;
                proxy_pass http://127.0.0.1:5244;
                proxy_cache off;
                proxy_cache_bypass 1;
                proxy_no_cache 1;
                proxy_buffering off;
                sub_filter_once on;
                sub_filter 'data-appversion="4.9.0.42"' 'data-appversion="4.9.0.42-wp1"';
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Pragma "no-cache" always;
        }

        location ^~ /web/ {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_redirect off;
                proxy_pass http://127.0.0.1:5244;
                proxy_cache off;
                proxy_cache_bypass 1;
                proxy_no_cache 1;
                proxy_buffering off;
                sub_filter_once on;
                sub_filter 'data-appversion="4.9.0.42"' 'data-appversion="4.9.0.42-wp1"';
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Pragma "no-cache" always;
        }

        # Some Emby clients normalize the same dashboard to /emby/web/.
        # Treat that alias identically; otherwise it falls through to the
        # cached catch-all location and can still serve the old bundle.
        location = /emby/web {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_redirect off;
                proxy_pass http://127.0.0.1:5244;
                proxy_cache off;
                proxy_cache_bypass 1;
                proxy_no_cache 1;
                proxy_buffering off;
                sub_filter_once on;
                sub_filter 'data-appversion="4.9.0.42"' 'data-appversion="4.9.0.42-wp1"';
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Pragma "no-cache" always;
        }

        location ^~ /emby/web/ {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_redirect off;
                proxy_pass http://127.0.0.1:5244;
                proxy_cache off;
                proxy_cache_bypass 1;
                proxy_no_cache 1;
                proxy_buffering off;
                sub_filter_once on;
                sub_filter 'data-appversion="4.9.0.42"' 'data-appversion="4.9.0.42-wp1"';
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Pragma "no-cache" always;
        }

            location /tvbox {
                proxy_pass http://127.0.0.1:81/tvbox;
                proxy_set_header Accept-Encoding "";
                sub_filter "DOCKER_ADDRESS" $client_scheme://$http_host;
                sub_filter "DANMU_API" DANMU_API;
                sub_filter_once off;
                sub_filter_types *;
                proxy_cache apicache;
            }

    location ^~ /dav/strm {
        proxy_pass http://127.0.0.1:5244/dav/strm;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Disposition;
        header_filter_by_lua_block {
            ngx.header.content_length = nil
        }
        body_filter_by_lua_block {
            local raw_host_str = "http://xiaoya.host:5678"
            local raw_sign_str = "SIGN_STR"
            local new_sign_str = ""
            local cur_host = ngx.var.client_scheme .. "://" .. (ngx.var.http_host or "")
            if ngx.arg[1] ~= "" then
                local data = ngx.arg[1]
                local total_diff = (#cur_host - #raw_host_str) + (#new_sign_str - #raw_sign_str)
                data = string.gsub(data, raw_host_str, cur_host)
                data = string.gsub(data, raw_sign_str, new_sign_str)
                data = string.gsub(data, "(##+)", function(m)
                    if #m >= 30 then
                        local new_count = #m - total_diff
                        return string.rep("#", math.max(0, new_count))
                    end
                    return m
                end)
                ngx.arg[1] = data
            end
        }
    }

    location ^~ /p/ {
        deny all;
        return 403;
    }

        location ^~ /__emby_115_link/ {
            internal;
            rewrite ^/__emby_115_link/(.*)$ /d/$1 break;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_redirect off;
            proxy_pass http://127.0.0.1:5244;
        }

        location ^~ /d/动漫/合集（115）/ {
            set $emby_115_target "";

            access_by_lua_block {
                local connections = ngx.shared.emby_115_connections
                local key = ngx.var.uri
                local acquired = false

                for _ = 1, 1200 do
                    local count, err = connections:incr(key, 1, 0, 21600)
                    if not count then
                        ngx.log(ngx.ERR, "failed to acquire 115 connection slot: ", err)
                        return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                    end

                    if count <= 2 then
                        acquired = true
                        ngx.ctx.emby_115_connection_key = key
                        connections:expire(key, 21600)
                        break
                    end

                    connections:incr(key, -1)
                    ngx.sleep(0.05)
                end

                if not acquired then
                    return ngx.exit(ngx.HTTP_GATEWAY_TIME_OUT)
                end

                local link_uri = string.gsub(
                    ngx.var.uri,
                    "^/d/",
                    "/__emby_115_link/",
                    1)
                local response = ngx.location.capture(link_uri, {
                    args = ngx.var.args,
                    method = ngx.HTTP_GET
                })
                local target = response.header["Location"]
                if (response.status ~= 301 and response.status ~= 302)
                    or not target
                    or not string.match(target, "^https?://") then
                    ngx.log(
                        ngx.ERR,
                        "failed to resolve 115 download link, status=",
                        response.status)
                    return ngx.exit(ngx.HTTP_BAD_GATEWAY)
                end

                ngx.var.emby_115_target = target
            }

            log_by_lua_block {
                local key = ngx.ctx.emby_115_connection_key
                if key then
                    local connections = ngx.shared.emby_115_connections
                    local remaining = connections:incr(key, -1)
                    if remaining and remaining <= 0 then
                        connections:delete(key)
                    end
                end
            }

            resolver 223.5.5.5 119.29.29.29 114.114.114.114 ipv6=off valid=300s;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_pass $emby_115_target;
        }

        location /d/ {
            set $fixed_uri "";
            rewrite_by_lua_block {
                local raw_uri = ngx.var.request_uri
                if string.find(raw_uri, "%%25%x%x") then
                    raw_uri = string.gsub(raw_uri, "%%25(%x%x)", "%%%1")
                end
                ngx.var.fixed_uri = raw_uri
            }
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass http://127.0.0.1:5244$fixed_uri;
        }
		gzip on;
		gzip_min_length 1k;
        gzip_comp_level 1;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_proxied any;
        listen 80 default_server;
		listen [::]:80;
        server_name _;
		#add_header Access-Control-Allow-Origin *;

	location /search {
		proxy_pass http://127.0.0.1:81/cgi-bin/search;
	}

        location /sou {
                proxy_pass http://127.0.0.1:81/cgi-bin/sou;
        }

        location /soutv {
                proxy_pass http://127.0.0.1:81/cgi-bin/soutv;
        }

        location /whatsnew {
                proxy_pass http://127.0.0.1:81/cgi-bin/whatsnew;
        }

        location ~ ^/image/(.*)$ {
                resolver 223.5.5.5 119.29.29.29 114.114.114.114;
                proxy_set_header Referer "https://servicewechat.com/wx2f9b06c1de1ccfca/84/page-frame.html";
                proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/53.0.2785.143 Safari/537.36 MicroMessenger/7.0.9.501 NetType/WIFI MiniProgramEnv/Windows WindowsWechat"; 
                proxy_pass      https://$1;
                proxy_set_header Host $proxy_host;
                proxy_cache apicache;
                proxy_buffering on;
        }

        location /foliate-js {
                proxy_pass http://127.0.0.1:81/foliate-js;
        }

		location /data {
			proxy_pass http://127.0.0.1:81/data;
		}

        location /tvbox/cat {
                auth_basic "Restricted Access";
                auth_basic_user_file /www/tvbox/cat/.htpasswd;
                proxy_pass http://127.0.0.1:81/tvbox/cat;
                proxy_set_header Accept-Encoding "";
                sub_filter "DOCKER_ADDRESS" $client_scheme://$http_host;
                sub_filter_once off;
                sub_filter_types *;
                proxy_cache apicache;
        }

        location ~* ^(?!\/d\/)(我的115|（115）|%E6%88%91%E7%9A%84115|%EF%BC%88115%EF%BC%89) {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;          
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_redirect off;                             
                proxy_pass http://127.0.0.1:5244;
                proxy_cache apicache;
                limit_req zone=one burst=2;
        }

        location / {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
				#proxy_set_header User-Agent: $http_user_agent;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_redirect off;
                proxy_pass http://127.0.0.1:5244;
				proxy_cache apicache;
                client_max_body_size 20000m;
        }

        location /dav {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Range $http_range;
                proxy_set_header If-Range $http_if_range;
                proxy_intercept_errors on;
                error_page 301 302 =307 $upstream_http_location;
                proxy_method $request_method;
                proxy_pass http://127.0.0.1:5244/dav;
				proxy_redirect off;
                proxy_cache apicache;
				limit_req zone=two burst=5;
        }

        location ^~ /@manage {
                deny all;
        }

        location ^~ /api/admin {
               deny all;
        }

        location ^~ /api/fs/copy {
                deny all;
        }

        location ^~ /api/fs/move {
                deny all;
        }

        location ^~ /api/fs/mkdir {
                deny all;
        }

        location ^~ /api/fs/put {
                deny all;
        }

	location ^~ /api/fs/search {
                deny all;
        }

}
