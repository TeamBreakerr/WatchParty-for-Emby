include /etc/nginx/modules/*.conf;
pid /tmp/watchparty-nginx-test.pid;
error_log /tmp/watchparty-nginx-test.log notice;

events {
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    include /tmp/emby-115-throttle.conf;

    server {
        listen 127.0.0.1:15679;
        include /tmp/emby-115-locations.conf;

        location /d/ {
            access_by_lua_file /data/emby-115-access.lua;
            proxy_pass http://127.0.0.1:5244;
        }
    }
}
