location ^~ /__emby_115_link/ {
    internal;
    rewrite ^/__emby_115_link/(.*)$ /d/$1 break;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_redirect off;
    proxy_pass http://127.0.0.1:5244;
}

location ^~ /d/动漫/合集（115）/ {
    set $emby_115_target "";

    access_by_lua_block {
        local connections = ngx.shared.emby_115_connections
        local key = ngx.var.uri
        local acquired = false

        for _ = 1, 1200 do
            local count, err = connections:incr(key, 1, 0, 21600)
            if not count then
                ngx.log(ngx.ERR, "failed to acquire 115 connection slot: ", err)
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            if count <= 2 then
                acquired = true
                ngx.ctx.emby_115_connection_key = key
                connections:expire(key, 21600)
                break
            end

            connections:incr(key, -1)
            ngx.sleep(0.05)
        end

        if not acquired then
            return ngx.exit(ngx.HTTP_GATEWAY_TIME_OUT)
        end

        local link_uri = string.gsub(
            ngx.var.uri,
            "^/d/",
            "/__emby_115_link/",
            1)
        local response = ngx.location.capture(link_uri, {
            args = ngx.var.args,
            method = ngx.HTTP_GET
        })
        local target = response.header["Location"]
        if (response.status ~= 301 and response.status ~= 302)
            or not target
            or not string.match(target, "^https?://") then
            ngx.log(
                ngx.ERR,
                "failed to resolve 115 download link, status=",
                response.status)
            return ngx.exit(ngx.HTTP_BAD_GATEWAY)
        end

        ngx.var.emby_115_target = target
    }

    log_by_lua_block {
        local key = ngx.ctx.emby_115_connection_key
        if key then
            local connections = ngx.shared.emby_115_connections
            local remaining = connections:incr(key, -1)
            if remaining and remaining <= 0 then
                connections:delete(key)
            end
        end
    }

    resolver 223.5.5.5 119.29.29.29 114.114.114.114 ipv6=off valid=300s;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass $emby_115_target;
}
